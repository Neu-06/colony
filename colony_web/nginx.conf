server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy para Inteligencia Artificial (FastAPI)
    location /api/v1/ {
        proxy_pass http://colony_ai:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy para Backend Spring Boot (Core)
    location /api/ {
        proxy_pass http://colony_core:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy para WebSockets
    location /ws-collab {
        proxy_pass http://colony_core:8080/ws-collab;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # ─── OnlyOffice Document Server (Aislado en subruta) ─────────────────────────
    # Siguiendo la documentacion oficial para proxys inversos con subruta.
    # El frontend pedira https://javi-dev.me/onlyoffice/...
    # Nginx le quitara el /onlyoffice/ y lo mandara limpio al contenedor.

    location /onlyoffice/ {
        proxy_pass http://colony_onlyoffice:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Esto es vital: le dice a OnlyOffice que genere todas sus URLs base con /onlyoffice
        proxy_set_header X-Forwarded-Host $host/onlyoffice;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}
