<div class="min-h-screen bg-background text-ink">
  <div
    *ngIf="isSidebarOpen"
    (click)="closeSidebar()"
    class="fixed inset-0 z-30 bg-ink opacity-40 backdrop-blur-sm lg:hidden"
  ></div>

  <div class="flex min-h-screen">
    <aside
      class="fixed inset-y-0 left-0 z-40 w-72 border-r border-border bg-surface p-4 transition-transform duration-300 lg:static lg:translate-x-0"
      [ngClass]="isSidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'"
    >
      <div class="mb-6 flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-primary">COLONY</p>
          <h2 class="text-lg font-bold">Panel de control</h2>
        </div>
        <button
          type="button"
          (click)="closeSidebar()"
          class="rounded-lg border border-border p-2 text-ink lg:hidden"
          aria-label="Cerrar menu"
        >
          <span class="block h-0.5 w-4 rotate-45 bg-ink"></span>
          <span class="-mt-0.5 block h-0.5 w-4 -rotate-45 bg-ink"></span>
        </button>
      </div>

      <nav class="space-y-2">
        <a
          *ngFor="let item of navItems"
          [routerLink]="item.link"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          routerLinkActive="bg-primary text-white"
          (click)="closeSidebar()"
          class="block rounded-xl border border-border px-3 py-3 text-sm transition hover:border-primary"
        >
          <p class="font-semibold">{{ item.label }}</p>
          <p class="mt-1 text-xs opacity-80">{{ item.description }}</p>
        </a>
      </nav>

      <div class="mt-6 rounded-xl border border-border bg-background p-4">
        <p class="text-xs font-semibold text-primary">Estado</p>
        <p class="mt-1 text-sm text-ink-light">Sesion activa y lista para gestionar workflows.</p>
      </div>
    </aside>

    <div class="flex min-w-0 flex-1 flex-col">
      <header class="sticky top-0 z-20 border-b border-border bg-surface px-4 py-3 backdrop-blur sm:px-6 lg:px-8">
        <div class="mx-auto flex w-full max-w-7xl items-center justify-between gap-3">
          <div class="flex items-center gap-3">
            <button
              type="button"
              (click)="toggleSidebar()"
              class="rounded-lg border border-border p-2 lg:hidden"
              aria-label="Abrir menu"
            >
              <span class="mb-1 block h-0.5 w-5 bg-ink"></span>
              <span class="mb-1 block h-0.5 w-5 bg-ink"></span>
              <span class="block h-0.5 w-5 bg-ink"></span>
            </button>
            <div>
              <h1 class="text-lg font-semibold sm:text-xl">Dashboard</h1>
              <p class="text-xs text-ink-light sm:text-sm">Orquesta politicas y procesos en tiempo real.</p>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <button
              type="button"
              (click)="logout()"
              class="rounded-xl border border-border bg-surface px-3 py-2 text-sm font-semibold text-ink transition hover:bg-secondary"
            >
              Cerrar sesion
            </button>
          </div>
        </div>
      </header>

      <main class="flex-1 overflow-auto px-4 py-5 sm:px-6 lg:px-8">
        <div class="mx-auto h-full w-full max-w-7xl">
          <router-outlet />
        </div>
      </main>
    </div>
  </div>
</div>
