<aside class="h-full border-t border-border bg-surface p-4 lg:border-l lg:border-t-0">
  <h2 class="text-sm font-bold uppercase tracking-wide text-primary">Configuracion</h2>

  @if (!selectedNode()) {
    <p class="mt-3 rounded-xl border border-border bg-background px-3 py-4 text-sm text-ink-light">
      Selecciona un nodo para configurar.
    </p>
  }

  @if (isActividad(selectedNode())) {
    <form [formGroup]="actividadForm" class="mt-4 space-y-4">
      <div>
        <label class="mb-1 block text-xs font-semibold uppercase tracking-wide text-ink-light">Nombre de tarea</label>
        <input
          formControlName="nombre"
          type="text"
          class="w-full rounded-lg border border-border bg-background px-3 py-2 text-sm outline-none focus:border-primary"
        />
      </div>

      <section>
        <div class="mb-2 flex items-center justify-between">
          <p class="text-xs font-semibold uppercase tracking-wide text-ink-light">Constructor de formularios</p>
          <button
            type="button"
            (click)="addField()"
            class="rounded-md bg-primary px-2 py-1 text-xs font-semibold text-white hover:bg-primary-hover"
          >
            Anadir Campo
          </button>
        </div>

        <div formArrayName="esquemaFormulario" class="space-y-2">
          @for (field of fields.controls; track $index) {
            <div [formGroupName]="$index" class="rounded-xl border border-border bg-background p-3">
              <div class="grid gap-2">
                <input
                  formControlName="nombre"
                  type="text"
                  placeholder="Nombre del campo"
                  class="w-full rounded-md border border-border bg-surface px-2 py-1.5 text-sm outline-none focus:border-primary"
                />

                <select
                  formControlName="tipo"
                  class="w-full rounded-md border border-border bg-surface px-2 py-1.5 text-sm outline-none focus:border-primary"
                >
                  @for (fieldType of fieldTypes; track fieldType) {
                    <option [value]="fieldType">{{ fieldType }}</option>
                  }
                </select>

                <label class="flex items-center gap-2 text-xs font-semibold text-ink-light">
                  <input type="checkbox" formControlName="requerido" />
                  Obligatorio
                </label>
              </div>

              <button
                type="button"
                (click)="removeField($index)"
                class="mt-2 rounded-md border border-border px-2 py-1 text-xs font-semibold text-danger hover:border-danger"
              >
                Eliminar
              </button>
            </div>
          }
        </div>
      </section>
    </form>
  }

  @if (isCompuerta(selectedNode())) {
    <form [formGroup]="compuertaForm" class="mt-4 space-y-3">
      <label class="mb-1 block text-xs font-semibold uppercase tracking-wide text-ink-light">Condicion Logica</label>
      <input
        formControlName="condicionLogica"
        type="text"
        placeholder="monto > 1000"
        class="w-full rounded-lg border border-border bg-background px-3 py-2 text-sm outline-none focus:border-primary"
      />
    </form>
  }
</aside>
