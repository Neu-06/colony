<main class="h-screen w-screen flex overflow-hidden bg-[var(--canvas-bg)] text-ink">
  <app-sidebar-toolbar class="shrink-0"></app-sidebar-toolbar>

  <section class="relative flex min-w-0 flex-1 flex-col">
    <header class="flex items-center justify-between gap-3 border-b border-border bg-surface px-4 py-3 sm:px-6">
      <div>
        <p class="text-xs font-semibold uppercase tracking-wide text-primary">Workflow Builder</p>
        <h1 class="text-lg font-bold sm:text-xl">Canvas de Diagramas por Calles</h1>
      </div>

      <div class="flex items-center gap-2">
        <button
          type="button"
          (click)="clearBoard()"
          class="rounded-lg border border-border bg-surface px-3 py-2 text-sm font-semibold text-ink hover:bg-secondary"
        >
          Limpiar
        </button>
        <a
          routerLink="/app"
          class="rounded-lg border border-border bg-surface px-3 py-2 text-sm font-semibold text-ink hover:bg-secondary"
        >
          Volver al dashboard
        </a>
      </div>
    </header>

    <div class="min-h-0 flex-1 p-3 sm:p-4">
      <app-canvas-board></app-canvas-board>
    </div>

    <button
      type="button"
      (click)="publishGraph()"
      class="absolute bottom-5 right-5 rounded-xl bg-primary px-5 py-3 text-sm font-semibold text-white shadow-lg hover:bg-primary-hover"
    >
      Publicar / Guardar
    </button>
  </section>
</main>
