<main class="h-dvh w-screen overflow-hidden bg-[var(--canvas-bg)] text-ink">
  <section class="flex h-full min-w-0 flex-col">
    <header class="border-b border-border bg-surface px-4 py-3 sm:px-6">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex min-w-[260px] flex-1 items-center gap-3">
          <a
            routerLink="/app"
            class="rounded-lg border border-border bg-background px-3 py-2 text-sm font-semibold text-ink hover:bg-secondary"
          >
            Volver
          </a>

          <input
            [(ngModel)]="flowName"
            type="text"
            class="w-full rounded-lg border border-border bg-background px-3 py-2 text-sm font-semibold outline-none focus:border-primary"
            placeholder="Nombre del flujo"
          />
        </div>

        <div class="flex items-center gap-2">
          <button
            type="button"
            (click)="toggleMobileTools()"
            class="rounded-lg border border-border bg-surface px-3 py-2 text-xs font-semibold text-ink hover:bg-secondary lg:hidden"
          >
            Herramientas
          </button>
          <button
            type="button"
            (click)="toggleMobileProperties()"
            class="rounded-lg border border-border bg-surface px-3 py-2 text-xs font-semibold text-ink hover:bg-secondary lg:hidden"
          >
            Propiedades
          </button>
          <button
            type="button"
            (click)="toggleLeftSidebar()"
            class="hidden rounded-lg border border-border bg-surface px-3 py-2 text-sm font-semibold text-ink hover:bg-secondary lg:inline-flex"
          >
            {{ isLeftSidebarCollapsed ? 'Mostrar Herramientas' : 'Ocultar Herramientas' }}
          </button>
          <button
            type="button"
            (click)="toggleRightSidebar()"
            class="hidden rounded-lg border border-border bg-surface px-3 py-2 text-sm font-semibold text-ink hover:bg-secondary lg:inline-flex"
          >
            {{ isRightSidebarCollapsed ? 'Mostrar Propiedades' : 'Ocultar Propiedades' }}
          </button>
          <button
            type="button"
            (click)="saveDraft()"
            [disabled]="isSaving"
            class="rounded-lg border border-border bg-surface px-3 py-2 text-sm font-semibold text-ink hover:bg-secondary disabled:opacity-70"
          >
            Guardar Borrador
          </button>
          <button
            type="button"
            (click)="publishGraph()"
            [disabled]="isSaving"
            class="rounded-lg bg-primary px-3 py-2 text-sm font-semibold text-white hover:bg-primary-hover disabled:opacity-70"
          >
            Publicar Flujo
          </button>
          <button
            type="button"
            (click)="deleteCurrentDiagram()"
            [disabled]="!activePolicyId() || isDeleting"
            class="rounded-lg border border-red-300 bg-red-50 px-3 py-2 text-sm font-semibold text-red-700 hover:bg-red-100 disabled:cursor-not-allowed disabled:opacity-55"
          >
            {{ isDeleting ? 'Eliminando...' : 'Eliminar Diagrama' }}
          </button>
        </div>
      </div>

      @if (saveMessage) {
        <p class="mt-2 text-xs font-medium text-ink-light">{{ saveMessage }}</p>
      }

      @if (isLoadingPolicy) {
        <p class="mt-2 text-xs font-medium text-primary">Cargando borrador...</p>
      }
    </header>

    <section
      class="grid min-h-0 flex-1 grid-cols-1"
      [ngClass]="{
        'lg:grid-cols-[192px_minmax(0,1fr)_320px]': !isLeftSidebarCollapsed && !isRightSidebarCollapsed,
        'lg:grid-cols-[0px_minmax(0,1fr)_320px]': isLeftSidebarCollapsed && !isRightSidebarCollapsed,
        'lg:grid-cols-[192px_minmax(0,1fr)_0px]': !isLeftSidebarCollapsed && isRightSidebarCollapsed,
        'lg:grid-cols-[0px_minmax(0,1fr)_0px]': isLeftSidebarCollapsed && isRightSidebarCollapsed
      }"
    >
      <div class="hidden min-h-0 overflow-hidden lg:block">
        @if (!isLeftSidebarCollapsed) {
          <app-toolbar class="min-h-0"></app-toolbar>
        }
      </div>
      <div class="flex-1 min-h-0 p-2 sm:p-4">
        <app-board class="block h-full"></app-board>
      </div>
      <div class="hidden min-h-0 overflow-hidden lg:block">
        @if (!isRightSidebarCollapsed) {
          <app-config-panel class="min-h-0"></app-config-panel>
        }
      </div>
    </section>

    @if (isMobileToolsOpen || isMobilePropertiesOpen) {
      <div class="fixed inset-0 z-[90] bg-slate-900/40 lg:hidden" (click)="closeMobilePanels()"></div>
    }

    <aside
      class="fixed inset-y-0 left-0 z-[100] w-[280px] max-w-[85vw] transform border-r border-border bg-surface shadow-xl transition-transform duration-200 lg:hidden"
      [ngClass]="isMobileToolsOpen ? 'translate-x-0' : '-translate-x-full'"
    >
      <div class="flex items-center justify-between border-b border-border px-3 py-2">
        <h3 class="text-sm font-bold text-ink">Herramientas</h3>
        <button type="button" (click)="closeMobilePanels()" class="rounded border border-border px-2 py-1 text-xs font-semibold text-ink-light">Cerrar</button>
      </div>
      <div class="h-[calc(100dvh-49px)] overflow-auto">
        <app-toolbar class="block min-h-full"></app-toolbar>
      </div>
    </aside>

    <aside
      class="fixed inset-y-0 right-0 z-[100] w-[320px] max-w-[90vw] transform border-l border-border bg-surface shadow-xl transition-transform duration-200 lg:hidden"
      [ngClass]="isMobilePropertiesOpen ? 'translate-x-0' : 'translate-x-full'"
    >
      <div class="flex items-center justify-between border-b border-border px-3 py-2">
        <h3 class="text-sm font-bold text-ink">Propiedades</h3>
        <button type="button" (click)="closeMobilePanels()" class="rounded border border-border px-2 py-1 text-xs font-semibold text-ink-light">Cerrar</button>
      </div>
      <div class="h-[calc(100dvh-49px)] overflow-auto">
        <app-config-panel class="block min-h-full"></app-config-panel>
      </div>
    </aside>
  </section>
</main>
