<section class="relative h-full w-full overflow-auto rounded-2xl border border-gray-300 bg-[var(--color-canvas-bg)]">
  <div
    class="relative min-w-[1100px] origin-top-left transition-transform duration-150"
    [style.transform]="'scale(' + zoomNivel() + ')'"
    [style.height.px]="altoTotalCanvasPx()"
  >
    <div #boardSurface class="absolute inset-0">
      <div class="absolute inset-0 z-0 flex flex-col">
        @for (carril of carriles(); track carril.id; let laneIndex = $index) {
          <section
            data-lane-visual
            class="relative border-b border-gray-300"
            [style.height.px]="carril.altoPx || altoCarrilPx"
            [ngClass]="laneIndex % 2 === 0 ? 'bg-slate-50' : 'bg-white'"
          ></section>
        }
      </div>

      <div
        #jsplumbContainer
        id="jsplumb-container"
        data-lane-dropzone
        class="absolute inset-0 z-10 h-full w-full"
        (dragover)="allowDrop($event)"
        (drop)="onDrop($event)"
        (click)="clearSelection($event)"
      >
        @for (nodo of nodos(); track nodo.idNodo) {
          <article
            [id]="nodeElementId(nodo.idNodo)"
            data-node-card
            (click)="onNodeClick(nodo, $event)"
            class="absolute z-20 cursor-move select-none"
            [style.left.px]="nodo.posicion.x"
            [style.top.px]="nodo.posicion.y"
            [ngClass]="isSelected(nodo.idNodo) ? 'ring-2 ring-blue-500 ring-offset-1 rounded-md' : ''"
          >
            <app-nodo-visual [datos]="nodo"></app-nodo-visual>
          </article>
        }
      </div>

      <div class="pointer-events-none absolute inset-y-0 left-0 z-30 flex w-20 flex-col">
        @for (carril of carriles(); track carril.id) {
          <section
            class="relative border-b border-gray-300 overflow-hidden"
            [style.height.px]="carril.altoPx || altoCarrilPx"
            [attr.data-carril-id]="carril.id"
          >
            <div class="pointer-events-auto absolute inset-y-0 left-0 flex w-20 items-center justify-center border-r border-gray-300 bg-[var(--color-lane-header)] px-2">
              @if (carrilEditandoId === carril.id) {
                <select
                  [attr.data-lane-input-for]="carril.id"
                  [ngModel]="carril.departamentoId || ''"
                  (ngModelChange)="actualizarCarrilConDepartamento(carril.id, $event)"
                  (blur)="finalizarEdicionCarril()"
                  (keydown.enter)="finalizarEdicionCarril()"
                  class="w-full rotate-180 bg-transparent text-center text-[11px] font-bold uppercase tracking-widest text-slate-700 outline-none focus:ring-1 focus:ring-blue-400 [text-orientation:mixed] [writing-mode:vertical-rl]"
                >
                  <option value="" disabled>SELECCIONA</option>
                  @for (departamento of departamentos; track departamento.id) {
                    <option [value]="departamento.id">{{ departamento.nombre }}</option>
                  }
                </select>
              } @else {
                <button
                  type="button"
                  (click)="iniciarEdicionCarril(carril.id)"
                  class="w-full rotate-180 bg-transparent text-center text-[11px] font-bold uppercase tracking-widest text-slate-700 outline-none [text-orientation:mixed] [writing-mode:vertical-rl]"
                  title="Haz clic para asignar departamento"
                >
                  {{ carril.nombre || 'CARRIL' }}
                </button>
              }
            </div>
            <!-- Asa de redimensionado vertical -->
            <div
              class="absolute bottom-0 left-0 right-0 h-2 cursor-row-resize bg-transparent hover:bg-blue-200 hover:opacity-60 transition-colors z-40"
              (mousedown)="iniciarRedimensionadoCarril($event, carril.id)"
              title="Arrastra para cambiar alto del carril"
            ></div>
          </section>
        }
      </div>
    </div>
  </div>
</section>
