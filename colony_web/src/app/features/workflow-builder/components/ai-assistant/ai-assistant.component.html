<div class="flex h-full flex-col bg-slate-50">
  <!-- Área de Mensajes -->
  <div class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
    <div *ngIf="messages.length === 0"
      class="flex flex-col items-center justify-center h-full opacity-40 text-center px-4">
      <div class="w-16 h-16 bg-slate-200 rounded-full flex items-center justify-center mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-slate-400" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
        </svg>
      </div>
      <p class="text-sm font-medium">Asistente IA</p>
      <p class="text-[11px] leading-relaxed mt-1">Dime: "Agrega una tarea", "Borra el inicio" o "Mueve el nodo x a la
        derecha".</p>
    </div>

    <div *ngFor="let msg of messages"
      [ngClass]="msg.role === 'user' ? 'ml-auto bg-blue-600 text-white rounded-tr-none' : 'mr-auto bg-white text-slate-700 border border-slate-200 rounded-tl-none'"
      class="max-w-[90%] rounded-2xl px-4 py-3 text-sm shadow-sm transition-all duration-300 animate-in fade-in slide-in-from-bottom-2">
      <p class="leading-relaxed">{{ msg.text }}</p>
    </div>

    <!-- Indicador de Carga / IA Pensando -->
    <div *ngIf="isAiLoading"
      class="mr-auto bg-white text-slate-400 border border-slate-100 rounded-2xl rounded-tl-none px-4 py-3 flex items-center gap-3">
      <div class="flex gap-1">
        <div class="w-1.5 h-1.5 bg-blue-400 rounded-full animate-bounce" style="animation-delay: 0s"></div>
        <div class="w-1.5 h-1.5 bg-blue-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
        <div class="w-1.5 h-1.5 bg-blue-400 rounded-full animate-bounce" style="animation-delay: 0.4s"></div>
      </div>
      <span class="text-[10px] font-bold uppercase tracking-widest">Procesando...</span>
    </div>
  </div>

  <!-- Botones de Acción Rápida -->
  <div class="px-4 py-2 border-t border-slate-100 flex gap-2 overflow-x-auto no-scrollbar bg-slate-50/80">
    <button (click)="sugerirMejoras()" [disabled]="isAiLoading"
      class="flex-none px-3 py-1.5 bg-white border border-slate-200 rounded-full text-[10px] font-bold text-slate-600 shadow-sm hover:bg-blue-50 hover:border-blue-200 transition-all">
      Sugerir Mejoras
    </button>
    <button (click)="autoCorregir()" [disabled]="isAiLoading"
      class="flex-none px-3 py-1.5 bg-white border border-slate-200 rounded-full text-[10px] font-bold text-slate-600 shadow-sm hover:bg-amber-50 hover:border-amber-200 transition-all">
      Auto-Corregir
    </button>
  </div>

  <!-- Barra de Entrada -->
  <div class="p-4 bg-white border-t border-slate-200">
    <div class="flex items-end gap-3">
      <!-- Contenedor del Textarea -->
      <div
        class="flex-1 relative bg-slate-100 rounded-2xl border border-slate-200 p-2 focus-within:ring-2 focus-within:ring-blue-500/20 focus-within:border-blue-500 transition-all">
        <textarea [(ngModel)]="comandoDetectado" (keydown.enter)="$event.preventDefault(); enviarComando()"
          [disabled]="isAiLoading" rows="2" placeholder="Escribe tu comando..."
          class="w-full bg-transparent border-none outline-none text-sm px-2 py-1 resize-none max-h-32 text-slate-700 placeholder:text-slate-400 disabled:opacity-50"></textarea>

        <!-- Indicador de Escucha flotante o dentro si es solo texto -->
        <div *ngIf="estaEscuchando" class="absolute -top-6 left-2 flex items-center gap-1.5 animate-pulse">
          <span class="flex h-2 w-2 rounded-full bg-red-500"></span>
          <span class="text-[10px] font-bold text-red-500 uppercase tracking-tight">Escuchando...</span>
        </div>
      </div>

      <!-- Columna de Botones de Acción -->
      <div class="flex flex-col items-center gap-2 mb-0">
        <!-- Botón Micrófono -->
        <button (click)="toggleDictado()" [disabled]="isAiLoading"
          [ngClass]="estaEscuchando ? 'bg-red-50 text-red-500 border-red-200 animate-pulse' : 'bg-slate-50 text-slate-400 border-slate-200 hover:text-blue-600 hover:border-blue-300'"
          class="p-2.5 rounded-xl border transition-all shadow-sm group">
          <svg *ngIf="!estaEscuchando" xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
          </svg>
          <div *ngIf="estaEscuchando" class="flex gap-0.5 items-center">
            <div class="w-1 h-3 bg-red-500 rounded-full"></div>
            <div class="w-1 h-5 bg-red-500 rounded-full"></div>
            <div class="w-1 h-3 bg-red-500 rounded-full"></div>
          </div>
        </button>

        <!-- Botón Enviar -->
        <button (click)="enviarComando()" [disabled]="!comandoDetectado.trim() || isAiLoading"
          class="bg-blue-600 text-white rounded-xl p-3 shadow-lg shadow-blue-600/20 hover:bg-blue-700 disabled:bg-slate-300 disabled:shadow-none transition-all">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
