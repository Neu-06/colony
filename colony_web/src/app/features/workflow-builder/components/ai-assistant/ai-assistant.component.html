<div class="flex flex-col h-full bg-slate-50">
  <!-- Área de Mensajes -->
  <div class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
    <div *ngIf="messages.length === 0" class="text-center mt-10">
      <div class="text-4xl mb-3">🤖</div>
      <p class="text-slate-400 text-sm italic">Soy tu copiloto BPMN. <br> ¿En qué puedo ayudarte hoy?</p>
    </div>

    <div *ngFor="let msg of messages" 
         [ngClass]="msg.role === 'user' ? 'ml-auto bg-blue-600 text-white' : 'mr-auto bg-white text-slate-700 border border-slate-200'"
         class="max-w-[85%] rounded-2xl px-4 py-2 text-sm shadow-sm">
      {{ msg.text }}
    </div>

    <!-- Spinner de Carga -->
    <div *ngIf="isAiLoading" class="flex items-center gap-2 text-slate-400">
      <div class="w-4 h-4 border-2 border-slate-300 border-t-blue-500 rounded-full animate-spin"></div>
      <span class="text-[10px] font-bold uppercase tracking-widest">IA procesando...</span>
    </div>
  </div>

  <!-- Botones Rápidos -->
  <div class="px-4 py-2 flex gap-2 overflow-x-auto no-scrollbar">
    <button (click)="sugerirMejoras()" 
            [disabled]="isAiLoading"
            class="whitespace-nowrap px-3 py-1.5 bg-white border border-slate-200 rounded-full text-[10px] font-bold text-slate-600 hover:bg-slate-50 transition-all shadow-sm flex items-center gap-1">
      💡 Sugerir
    </button>
    <button (click)="autoCorregir()" 
            [disabled]="isAiLoading"
            class="whitespace-nowrap px-3 py-1.5 bg-white border border-slate-200 rounded-full text-[10px] font-bold text-slate-600 hover:bg-slate-50 transition-all shadow-sm flex items-center gap-1">
      ✨ Corregir
    </button>
  </div>

  <!-- Barra de Input -->
  <div class="p-4 bg-white border-t border-slate-200">
    <div class="relative flex items-center gap-2 bg-slate-100 rounded-2xl p-2 border border-slate-200 focus-within:border-blue-400 transition-all">
      <input type="text" 
             [(ngModel)]="comandoUsuario"
             (keydown.enter)="enviarComando()"
             [disabled]="isAiLoading"
             placeholder="Escribe un comando..." 
             class="flex-1 bg-transparent border-none outline-none text-sm px-2 text-slate-700 placeholder:text-slate-400">
      
      <button class="text-slate-400 hover:text-blue-500 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
        </svg>
      </button>

      <button (click)="enviarComando()" 
              [disabled]="!comandoUsuario.trim() || isAiLoading"
              class="bg-blue-600 text-white rounded-xl p-2 hover:bg-blue-700 transition-all disabled:bg-slate-300 shadow-md shadow-blue-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
        </svg>
      </button>
    </div>
  </div>
</div>
