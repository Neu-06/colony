<header class="border-b border-border bg-surface px-4 py-3 sm:px-6">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div class="flex min-w-[280px] flex-1 items-center gap-3">
      <a
        routerLink="/app"
        class="rounded-lg border border-border bg-background px-3 py-2 text-sm font-semibold text-ink hover:bg-secondary"
      >
        Volver
      </a>

      <input
        [value]="flowName"
        (input)="onNameInput($any($event.target).value)"
        [readonly]="isReadOnly || (roomCode !== null && !isInitiator)"
        type="text"
        class="w-full rounded-lg border border-border bg-background px-3 py-2 text-sm font-semibold outline-none focus:border-primary"
        placeholder="Nombre del flujo"
      />
    </div>

    @if (!isReadOnly) {
      <div class="flex items-center gap-2">
        @if (!roomCode || isInitiator) {
          <button
            type="button"
            (click)="saveDraft.emit()"
            [disabled]="isSaving"
            class="rounded-lg border border-border bg-surface px-3 py-2 text-sm font-semibold text-ink hover:bg-secondary disabled:opacity-70"
          >
            Guardar Borrador
          </button>
          <button
            type="button"
            (click)="publish.emit()"
            [disabled]="isSaving"
            class="rounded-lg bg-primary px-3 py-2 text-sm font-semibold text-white hover:bg-primary-hover disabled:opacity-70"
          >
            Publicar Flujo
          </button>
          <button
            type="button"
            (click)="deleteDiagram.emit()"
            [disabled]="!hasActivePolicy || isDeleting"
            class="rounded-lg border border-red-300 bg-red-50 px-3 py-2 text-sm font-semibold text-red-700 hover:bg-red-100 disabled:cursor-not-allowed disabled:opacity-55"
          >
            {{ isDeleting ? 'Eliminando...' : 'Eliminar Diagrama' }}
          </button>
        }

        <!-- Botones de Colaboración -->
        @if (roomCode) {
          <div class="flex items-center gap-2 rounded-lg bg-blue-50 px-3 py-2">
            <span class="text-sm font-semibold text-blue-700">Canvas Code: {{ roomCode }}</span>
            <button
              type="button"
              (click)="leaveRoom.emit()"
              class="text-xs font-semibold text-red-600 hover:text-red-800"
            >
              Salir
            </button>
          </div>
        } @else {
          <button
            type="button"
            (click)="createRoom.emit()"
            class="rounded-lg bg-indigo-600 px-3 py-2 text-sm font-semibold text-white hover:bg-indigo-700"
          >
            Iniciar Colaboración
          </button>
        }
      </div>
    } @else {
      <span class="rounded-lg border border-border bg-background px-3 py-2 text-xs font-semibold text-ink-light">Solo lectura</span>
    }
  </div>

  <div class="mt-3 flex flex-wrap items-center gap-4">
    @if (!isReadOnly) {
      <button
        type="button"
        (click)="addCarril.emit()"
        class="rounded-md border border-gray-300 bg-white px-3 py-1.5 text-xs font-semibold text-gray-700 hover:bg-gray-50"
      >
        + Carril
      </button>
    }

    @if (!isReadOnly) {
      <div class="flex flex-row items-center gap-4">
        @for (item of herramientas; track item.dragType) {
          <button
            type="button"
            draggable="true"
            [title]="item.title"
            (dragstart)="onDragStart($event, item.dragType)"
            class="group flex h-10 w-10 cursor-grab items-center justify-center rounded-lg border border-border bg-background active:cursor-grabbing"
          >
            @if (item.key === 'inicio') {
              <span class="h-5 w-5 rounded-full bg-emerald-500"></span>
            }
            @if (item.key === 'tarea') {
              <span class="h-5 w-7 rounded-md border border-[var(--color-node-border)] bg-[var(--color-node-task)]"></span>
            }
            @if (item.key === 'compuerta') {
              <span class="h-5 w-5 rotate-45 rounded-sm bg-[var(--color-node-gateway)]"></span>
            }
            @if (item.key === 'fin') {
              <span class="h-5 w-5 rounded-full bg-rose-500"></span>
            }
          </button>
        }
      </div>
    }

    <div class="ml-auto flex items-center gap-2 rounded-lg border border-border bg-background px-2 py-1">
      <button
        type="button"
        (click)="zoomOut.emit()"
        class="rounded border border-border px-2 py-1 text-sm font-semibold text-ink hover:border-primary"
      >
        -
      </button>
      <span class="text-sm font-semibold text-ink">{{ (zoomNivel * 100).toFixed(0) }}%</span>
      <button
        type="button"
        (click)="zoomIn.emit()"
        class="rounded border border-border px-2 py-1 text-sm font-semibold text-ink hover:border-primary"
      >
        +
      </button>
    </div>
  </div>
</header>
