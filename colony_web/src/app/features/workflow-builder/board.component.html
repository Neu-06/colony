<section class="h-full overflow-auto rounded-2xl border border-border bg-[var(--canvas-bg)]" (click)="clearSelection($event)">
  <div
    #boardScroll
    class="relative min-w-[980px]"
    [style.minHeight.px]="boardMinHeight()"
    (dragover)="onNativeDragOver($event)"
    (drop)="onNativeDrop($event)"
    style="background-image: radial-gradient(circle at 1px 1px, var(--canvas-grid) 1px, transparent 0); background-size: 24px 24px;"
  >
    <div class="pointer-events-none absolute inset-0 z-10">
      @for (lane of swimlanes(); track lane.id) {
        <section class="border-b border-[var(--swimlane-border)]">
          <header data-lane-header class="pointer-events-auto flex items-center justify-between gap-2 border-b border-border bg-surface/90 px-3 py-2 backdrop-blur-sm">
            @if (editingLaneId() === lane.id) {
              <input
                #laneInput
                type="text"
                [value]="lane.nombre"
                (blur)="finishLaneEdit(lane.id, laneInput.value)"
                (keydown.enter)="finishLaneEdit(lane.id, laneInput.value)"
                class="w-full rounded-md border border-border bg-background px-2 py-1 text-sm font-semibold outline-none focus:border-primary"
              />
            } @else {
              <button
                type="button"
                (click)="startLaneEdit(lane.id)"
                class="text-left text-sm font-semibold text-ink hover:text-primary"
              >
                {{ lane.nombre }}
              </button>
            }

            <button
              type="button"
              (click)="removeLane(lane.id)"
              [disabled]="swimlanes().length <= 1"
              class="rounded-md border border-border bg-background px-2 py-1 text-xs font-semibold text-ink-light hover:border-danger hover:text-danger disabled:cursor-not-allowed disabled:opacity-40"
            >
              Eliminar
            </button>
          </header>

          <div data-lane-drop="true" [attr.data-lane-id]="lane.id" class="h-52"></div>
        </section>
      }

      <div class="pointer-events-auto p-4">
        <button
          type="button"
          (click)="addLane()"
          class="w-full rounded-xl border border-dashed border-primary bg-surface px-4 py-4 text-sm font-semibold text-primary hover:bg-secondary"
        >
          + Anadir Departamento
        </button>
      </div>
    </div>

    <div class="pointer-events-none absolute right-3 top-3 z-40 flex gap-2">
      <button
        type="button"
        (click)="deleteSelectedNode()"
        [disabled]="!selectedNode()"
        class="pointer-events-auto rounded-lg border border-border bg-background px-3 py-1.5 text-xs font-semibold text-danger hover:border-danger disabled:cursor-not-allowed disabled:opacity-50"
      >
        Eliminar Nodo
      </button>
    </div>

    <div #reteHost class="absolute inset-0 z-20"></div>
  </div>
</section>
