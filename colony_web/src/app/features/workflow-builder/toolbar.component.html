<aside class="h-full border-r border-border bg-surface p-3">
  <div class="flex flex-row items-center gap-3">
    @for (item of items; track item.dragType) {
      <button
        type="button"
        draggable="true"
        [title]="item.title"
        (dragstart)="onDragStart($event, item.dragType)"
        class="flex h-10 w-10 cursor-grab items-center justify-center rounded-lg border border-border bg-background active:cursor-grabbing"
      >
        @if (item.key === 'inicio') {
          <span class="h-5 w-5 rounded-full bg-emerald-500"></span>
        }
        @if (item.key === 'tarea') {
          <span class="h-5 w-7 rounded-md border border-[var(--color-node-border)] bg-[var(--color-node-task)]"></span>
        }
        @if (item.key === 'compuerta') {
          <span class="h-5 w-5 rotate-45 rounded-sm bg-[var(--color-node-gateway)]"></span>
        }
        @if (item.key === 'fin') {
          <span class="h-5 w-5 rounded-full bg-rose-500"></span>
        }
      </button>
    }
  </div>
</aside>
