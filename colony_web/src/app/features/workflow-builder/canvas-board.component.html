<section
  #canvasBoard
  [id]="canvasDropListId"
  cdkDropList
  [cdkDropListData]="nodes()"
  [cdkDropListConnectedTo]="[toolbarDropListId]"
  (cdkDropListDropped)="onDrop($event)"
  class="canvas-board relative h-full min-h-[520px] overflow-hidden rounded-2xl border border-border bg-[var(--canvas-bg)]"
  style="background-image: radial-gradient(circle at 1px 1px, var(--canvas-grid) 1px, transparent 0); background-size: 24px 24px;"
>
  <div class="pointer-events-none absolute inset-0 grid" [style.gridTemplateRows]="'repeat(' + lanes().length + ', minmax(0, 1fr))'">
    @for (lane of lanes(); track lane.id) {
      <div class="relative border-b border-[var(--swimlane-border)] last:border-b-0">
        <span class="absolute left-3 top-2 rounded-md bg-surface px-2 py-1 text-xs font-semibold text-ink-light">
          {{ lane.title }}
        </span>
      </div>
    }
  </div>

  <svg class="pointer-events-none absolute inset-0 h-full w-full">
    @for (edge of edges(); track edge.id) {
      <line
        [attr.x1]="edgeStartX(edge)"
        [attr.y1]="edgeStartY(edge)"
        [attr.x2]="edgeEndX(edge)"
        [attr.y2]="edgeEndY(edge)"
        stroke="var(--node-line)"
        stroke-width="2"
      ></line>
    }
  </svg>

  @for (node of nodes(); track node.id) {
    <button
      type="button"
      cdkDrag
      [cdkDragData]="node"
      [cdkDragBoundary]="'.canvas-board'"
      [cdkDragFreeDragPosition]="{ x: node.x, y: node.y }"
      (cdkDragEnded)="onNodeDragEnd(node.id, $event)"
      (click)="onNodeClick(node.id)"
      class="absolute left-0 top-0"
      [style.width.px]="node.width"
      [style.height.px]="node.height"
      [style.zIndex]="10"
    >
      @if (node.type === 'start') {
        <span class="flex h-full w-full items-center justify-center rounded-full bg-[var(--node-start)] text-xs font-bold text-white shadow">
          Inicio
        </span>
      }

      @if (node.type === 'task') {
        <span class="flex h-full w-full items-center justify-center rounded-xl border-2 border-primary bg-[var(--node-task)] px-2 text-center text-sm font-semibold text-ink shadow-sm">
          {{ node.label }}
        </span>
      }

      @if (node.type === 'gateway') {
        <span class="flex h-full w-full items-center justify-center">
          <span class="flex h-12 w-12 rotate-45 items-center justify-center rounded-sm bg-[var(--node-gateway)] text-ink shadow">
            <span class="-rotate-45 text-[10px] font-bold">Gate</span>
          </span>
        </span>
      }

      @if (node.type === 'end') {
        <span class="flex h-full w-full items-center justify-center rounded-full bg-[var(--node-end)] text-xs font-bold text-white shadow">
          Fin
        </span>
      }
    </button>
  }
</section>
