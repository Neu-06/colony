server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto

spring:
  data:
    mongodb:
      #uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/colony_db}
      uri: ${SPRING_DATA_MONGODB_URI:mongodb+srv://colonydb_user:pass123@colonydb.sfahnql.mongodb.net/colony_db?appName=colonydb}
  servlet:
    multipart:
      enabled: true
      max-file-size: ${S3_MAX_FILE_SIZE:100MB}
      max-request-size: ${S3_MAX_REQUEST_SIZE:110MB}

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:bXktY29sb255LWp3dC1zZWNyZXQtbXV5LWxhcmdvLWQzLWVudHJvcGlhLXBhcmEtaHMyNTY=}
    expiration-ms: ${SECURITY_JWT_EXPIRATION_MS:86400000}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  ai:
    recommend-url: ${APP_AI_RECOMMEND_URL:http://localhost:8000/api/v1/recommend}
    fix-url: ${APP_AI_FIX_URL:http://localhost:8000/api/v1/fix}

  # Repositorio documental AWS S3
  s3:
    access-key: ${CLAVE_ACCESO:}
    secret-key: ${CLAVE_SECRETA:}
    bucket: ${S3_BUCKET:colony-documentos}
    region: ${S3_REGION:us-east-2}
    presigned-expiration-minutes: ${S3_PRESIGNED_EXPIRATION_MINUTES:60}

  onlyoffice:
    server-url: ${ONLYOFFICE_URL:http://localhost:8100}
    # URL que OnlyOffice (Docker) usa para descargar documentos y enviar callbacks.
    # Dentro de Docker, 'localhost' apunta al contenedor, no al host.
    # En Windows/Mac: host.docker.internal. En Linux: 172.17.0.1
    backend-url: ${ONLYOFFICE_BACKEND_URL:http://host.docker.internal:8080}
    jwt-enabled: ${ONLYOFFICE_JWT_ENABLED:false}
